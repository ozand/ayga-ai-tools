<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Artifact Frame with Rendered SVG Only</title>
</head>
<body>
  <div class="artifact-content">
    <h2>Workflow Diagram</h2>
    <p>The workflow is shown below as rendered vector graphics.</p>
    <div class="mermaid-viewer">
      <svg id="claude-mermaid-0" width="400" height="200" viewBox="0 0 400 200">
        <style>
          .node rect { fill: #ececff; stroke: #9370db; }
          .edgeLabel { font-size: 12px; }
        </style>
        <g class="nodes">
          <g class="node" id="flowchart-A-0"><rect x="10" y="10" width="80" height="40"></rect><text x="20" y="30">Start</text></g>
          <g class="node" id="flowchart-B-1"><rect x="150" y="10" width="80" height="40"></rect><text x="160" y="30">Finish</text></g>
        </g>
      </svg>
    </div>
    <p>End of diagram section.</p>
  </div>
</body>
</html>
